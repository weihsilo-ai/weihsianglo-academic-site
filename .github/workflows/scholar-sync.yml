name: Sync Google Scholar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      STATUS_JSON: .scholar-sync-status.json
      SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Rebuild publications data from Google Scholar
        run: |
          if [ -n "$SERPAPI_API_KEY" ]; then
            python scripts/publications_pipeline.py sync-scholar --status-json "$STATUS_JSON"
          else
            echo "::warning::SERPAPI_API_KEY is not configured; running direct Google Scholar sync in soft-fail mode. Add the secret for reliable daily updates."
            python scripts/publications_pipeline.py sync-scholar --soft-fail --status-json "$STATUS_JSON"
          fi

      - name: Append workflow summary
        if: always()
        run: python scripts/publications_pipeline.py write-summary "$STATUS_JSON"

      - name: Require a successful fresh sync
        if: always()
        run: |
          python - <<'PY'
          import json
          import os
          import sys

          status_path = os.environ["STATUS_JSON"]
          try:
              with open(status_path, encoding="utf-8") as handle:
                  status = json.load(handle)
          except (OSError, json.JSONDecodeError) as error:
              print(f"::error::Scholar sync did not produce a readable status file: {error}")
              sys.exit(1)

          if status.get("result") != "success":
              message = status.get("message", "Scholar sync did not return a success result.")
              print(f"::error::{message}")
              sys.exit(1)
          PY

      - name: Commit updated publication data
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No publication changes detected."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update Google Scholar publications"
          git push
